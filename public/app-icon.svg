<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
  
  <!-- Glowing circular tracker badge -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="24"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="24" stroke-dasharray="750 300" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Inner filled core -->
  <circle cx="256" cy="256" r="110" fill="url(#accent)"/>
  
  <!-- Checkmark icon -->
  <path d="M196 256 L238 298 L318 214" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
